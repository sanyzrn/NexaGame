<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a120c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M6 3h3v27H6z%22 fill=%22%23d9aa45%22/%3E%3Cpath d=%22M9 4h18l-4 7 4 7H9z%22 fill=%22%23b3261e%22/%3E%3C/svg%3E" />
    <title>درفش — نبرد پهلوانان</title>
    <link rel="preload" href="./fonts/Vazirmatn-Black.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Telegram WebApp SDK, vendored so the game never waits on telegram.org. Harmless in a normal browser. -->
    <script src="/vendor/telegram-web-app.js"></script>
    <style>
      /* Branded pre-boot splash: paints instantly, before any JS or font arrives. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #1a120c;
        color: #f3e2b8;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        transition: opacity 0.4s ease;
      }
      #splash .flag {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 6px 24px rgba(217, 170, 69, 0.35));
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      #splash .name {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      }
      #splash .sub { font-size: 16px; opacity: 0.75; }
      #splash .bar {
        width: 190px;
        height: 6px;
        margin-top: 18px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(243, 226, 184, 0.15);
      }
      #splash .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #b3261e, #d9aa45);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes splash-slide { 0% { transform: translateX(120%); } 100% { transform: translateX(-260%); } }
      .splash-out { opacity: 0; pointer-events: none; }
      .splash-hidden { display: none !important; }

      /* M6: graceful error screen (boot failure) with a retry button. */
      #error-screen {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #1a120c;
        color: #f3e2b8;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        text-align: center;
        padding: 32px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #error-screen.error-visible { opacity: 1; pointer-events: auto; }
      #error-screen .title { font-size: 30px; font-weight: 800; }
      #error-screen .note { font-size: 15px; opacity: 0.75; line-height: 1.9; }
      #error-screen button {
        margin-top: 8px;
        padding: 14px 46px;
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        color: #3a1a08;
        background: linear-gradient(180deg, #f6d894, #d9aa45);
        border: none;
        border-radius: 14px;
        box-shadow: 0 4px 0 #8a6a2a;
      }
      #error-screen button:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a6a2a; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="flag" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 3h3v27H6z" fill="#d9aa45" />
        <path d="M9 4h18l-4 7 4 7H9z" fill="#b3261e" />
      </svg>
      <div class="name">درفش</div>
      <div class="sub">نبرد پهلوانان</div>
      <div class="bar"></div>
    </div>
    <div id="error-screen">
      <svg width="72" height="72" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 3h3v27H6z" fill="#d9aa45" />
        <path d="M9 4h18l-4 7 4 7H9z" fill="#b3261e" />
      </svg>
      <div class="title">میدان آماده نشد</div>
      <div class="note">اتصال اینترنت را بررسی کن و دوباره تلاش کن.</div>
      <button onclick="location.reload()">تلاش دوباره</button>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;background:#1a120c;color:#f3e2b8;display:flex;align-items:center;justify-content:center;font-family:system-ui,Tahoma,sans-serif;text-align:center;padding:24px;">
        برای اجرای «درفش» باید جاوااسکریپت فعال باشد.
      </div>
    </noscript>
    <div id="game"></div>
    <!-- If the bundle never arrives (a stalled network), the splash gives way to the error screen. -->
    <script>
      setTimeout(function () {
        if (!window.__darafshBooted) {
          var s = document.getElementById('splash');
          var e = document.getElementById('error-screen');
          if (s) s.className = 'splash-hidden';
          if (e) e.className = 'error-visible';
        }
      }, 25000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
