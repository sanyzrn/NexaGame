<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="referrer" content="no-referrer" />
  <title>NexaGame | اتصال امن</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif;background:#0b1020;color:#f8fafc}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#172441,#0b1020 62%)}
    main{width:min(100%,430px);border:1px solid #334155;border-radius:24px;padding:32px 24px;text-align:center;background:#111827}
    .symbol{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 20px;border:1px solid #475569;border-radius:20px;font-size:32px}
    h1{margin:0 0 10px;font-size:26px;letter-spacing:-.5px}p{line-height:1.9;color:#cbd5e1;margin:0 0 22px}
    .status{padding:13px 16px;border-radius:12px;background:#1e293b;color:#cbd5e1;font-size:14px;line-height:1.8}
    .status.success{background:#12352b;color:#bbf7d0}.status.error{background:#3b2027;color:#fecaca}
    .player{margin-top:18px;padding:15px;border:1px solid #334155;border-radius:14px;line-height:1.9}
    button{margin-top:16px;background:#334155;border:1px solid #64748b;color:#fff;padding:11px 23px;border-radius:12px;font:inherit;cursor:pointer}
    small{display:block;color:#94a3b8;margin-top:22px;font-size:12px;line-height:1.9}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">🎮</div>
    <h1>NexaGame</h1>
    <p>زیرساخت بازی آماده می‌شه. اول مطمئن می‌شیم بازیکن واقعاً از تلگرام اومده.</p>
    <div id="status" class="status" role="status" aria-live="polite">در حال بررسی اتصال امن…</div>
    <div id="player" class="player" hidden><strong id="welcome"></strong><br><span>حساب بازیکن با موفقیت در دیتابیس ثبت شد ✅</span></div>
    <button id="retry" type="button" hidden>🔄 تلاش مجدد</button>
    <small>نسخه زیرساخت • هویت در سرور تأیید می‌شود • هنوز بازی و امتیازی ساخته نشده</small>
  </main>
  <script>
    (() => {
      'use strict';
      const ENDPOINT = 'https://ygritvnannbrklplecdo.supabase.co/functions/v1/game-auth';
      const status = document.getElementById('status');
      const player = document.getElementById('player');
      const welcome = document.getElementById('welcome');
      const retry = document.getElementById('retry');
      const app = window.Telegram?.WebApp;

      function report(message, kind = '', canRetry = false) {
        status.textContent = message;
        status.className = 'status' + (kind ? ' ' + kind : '');
        retry.hidden = !canRetry;
      }

      async function connect() {
        player.hidden = true;
        retry.hidden = true;
        if (!app?.initData) {
          report('برای ورود امن، بازی رو از دکمه Open App داخل بات تلگرام باز کن.', 'error');
          return;
        }
        report('🔐 در حال تأیید هویت و ثبت بازیکن…');
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);
        try {
          const response = await fetch(ENDPOINT, {
            method: 'POST',
            mode: 'cors',
            credentials: 'omit',
            cache: 'no-store',
            referrerPolicy: 'no-referrer',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: app.initData }),
            signal: controller.signal
          });
          const data = await response.json();
          if (!response.ok || !data.ok || !data.player) {
            if (data.error === 'EXPIRED_INIT_DATA') {
              report('⏳ اعتبار ورود تموم شده؛ Mini App رو ببند و دوباره از داخل بات باز کن.', 'error');
            } else if (response.status === 401) {
              report('⛔ هویت تلگرام تأیید نشد. اپ رو از دکمه داخل بات دوباره باز کن.', 'error');
            } else {
              report('اتصال به سرور برقرار نشد. دوباره امتحان کن.', 'error', true);
            }
            return;
          }
          welcome.textContent = 'خوش اومدی، ' + (data.player.firstName || 'بازیکن') + '! 👋';
          player.hidden = false;
          report('✅ اتصال امن به تلگرام و Supabase برقرار شد.', 'success');
        } catch {
          report('⚠️ ارتباط با سرور برقرار نشد. اینترنت و دسترسی Supabase رو بررسی کن.', 'error', true);
        } finally {
          clearTimeout(timer);
        }
      }

      retry.addEventListener('click', connect);
      if (!app) {
        report('کتابخانه تلگرام در این مرورگر در دسترس نیست. بازی رو از داخل بات باز کن.', 'error');
        return;
      }
      try {
        app.ready();
        app.expand();
        connect();
      } catch {
        report('اجرای محیط تلگرام کامل نشد. اپ رو دوباره باز کن.', 'error', true);
      }
    })();
  </script>
</body>
</html>
