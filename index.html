<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>NexaGame | آماده‌سازی</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif;background:#0b1020;color:#f8fafc}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#172441,#0b1020 62%)}
    main{width:min(100%,430px);border:1px solid #334155;border-radius:24px;padding:32px 24px;text-align:center;background:#111827}
    .symbol{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 20px;border:1px solid #475569;border-radius:20px;font-size:32px}
    h1{margin:0 0 10px;font-size:26px;letter-spacing:-.5px}p{line-height:1.9;color:#cbd5e1;margin:0 0 22px}
    .status{padding:13px 16px;border-radius:12px;background:#1e293b;color:#d1fae5;font-size:14px;line-height:1.8}
    small{display:block;color:#94a3b8;margin-top:22px;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">🎮</div>
    <h1>NexaGame</h1>
    <p>زیرساخت بازی در حال آماده‌سازی است. به‌زودی اینجا بازی می‌کنیم!</p>
    <div id="status" class="status" role="status" aria-live="polite">در حال بررسی محیط اجرا…</div>
    <small>نسخه آزمایشی زیرساخت • بدون ورود و ذخیره اطلاعات</small>
  </main>
  <script>
    (() => {
      const status = document.getElementById('status');
      const app = window.Telegram?.WebApp;
      if (!app) {
        status.textContent = 'صفحه وب آماده است؛ اتصال به محیط تلگرام در این مرورگر در دسترس نیست.';
        return;
      }
      try {
        app.ready();
        app.expand();
        status.textContent = app.initData ? 'محیط Telegram Mini App شناسایی شد ✅' : 'کتابخانه تلگرام بارگذاری شد؛ برای بررسی نشست، صفحه را از دکمه داخل بات باز کن.';
      } catch {
        status.textContent = 'صفحه آماده است، اما راه‌اندازی محیط تلگرام کامل نشد.';
      }
    })();
  </script>
</body>
</html>
