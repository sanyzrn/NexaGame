name: Deploy NexaGame

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexagame-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Prepare distributable
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            mkdir -p dist
            cp index.html dist/index.html
          else
            echo 'Vite application detected; build follows.'
          fi

      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Vite application
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json ]]; then
            echo 'Bootstrapping initial lockfile; commit the generated lockfile after the first successful build.'
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund
          npm run build

      - name: Preserve initial dependency lockfile
        if: hashFiles('package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nexagame-package-lock
          path: package-lock.json
          retention-days: 3

      - name: Publish only dist files over encrypted FTPS
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing FTP_SERVER secret}"
          : "${FTP_USERNAME:?Missing FTP_USERNAME secret}"
          : "${FTP_PASSWORD:?Missing FTP_PASSWORD secret}"
          if [[ ! "$FTP_SERVER" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo 'FTP_SERVER must be a bare hostname or IP.' >&2
            exit 1
          fi
          port="${FTP_PORT:-21}"
          if [[ ! "$port" =~ ^[0-9]{1,5}$ ]] || (( 10#$port < 1 || 10#$port > 65535 )); then
            echo 'Invalid FTP_PORT.' >&2
            exit 1
          fi
          if [[ ! -s dist/index.html ]]; then
            echo 'Missing or empty dist/index.html; refusing to deploy.' >&2
            exit 1
          fi
          count=0
          while IFS= read -r -d '' file; do
            relative="${file#dist/}"
            curl --ipv4 --silent --show-error --fail --ssl-reqd \
              --connect-timeout 12 --max-time 90 --retry 2 \
              --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$file" \
              "ftp://${FTP_SERVER}:${port}/${relative}"
            count=$((count + 1))
          done < <(find dist -type f -print0 | sort -z)
          echo "Uploaded $count production files over FTPS."
          echo "✅ Uploaded $count build files to the verified game web root." >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose live HTML and remote FTPS file separately
        shell: bash
        run: |
          set -euo pipefail
          expected='<title>NexaGame | NexaFly</title>'
          if ! grep -Fq "$expected" dist/index.html; then
            echo '::error::Built HTML does not contain the expected NexaFly title.'
            exit 1
          fi
          port="${FTP_PORT:-21}"
          remote_file="$(mktemp)"
          trap 'rm -f "$remote_file"' EXIT
          echo 'Downloading remote index.html over encrypted FTPS to verify exact uploaded bytes...'
          curl --ipv4 --silent --show-error --fail --ssl-reqd \
            --connect-timeout 12 --max-time 40 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --output "$remote_file" "ftp://${FTP_SERVER}:${port}/index.html"
          if ! cmp -s dist/index.html "$remote_file"; then
            echo '::error::FTPS remote index.html differs from the built file. The upload target or another process is overwriting files.'
            echo '❌ The FTP directory does not contain the new HTML after upload.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'FTPS remote index.html matches the built NexaFly file byte-for-byte.'
          echo 'Checking the public website with a unique cache-busting query...'
          fresh="$(curl --silent --show-error --fail --location --retry 3 \
            --connect-timeout 12 --max-time 35 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://game.realmetaverse.ir/?nexa_deploy=${GITHUB_SHA}")"
          if [[ "$fresh" != *"$expected"* ]]; then
            echo '::error::FTPS contains the NEW file, but HTTPS still serves OLD HTML even for a unique URL. Hosting or proxy cache/rewrite needs investigation.'
            echo '❌ FTP file is current, but public HTTPS content is stale (cache/proxy/rewrite).' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Unique cache-busted URL serves NexaFly.'
          echo 'Checking the normal Telegram Mini App URL...'
          normal="$(curl --silent --show-error --fail --location --retry 3 \
            --connect-timeout 12 --max-time 35 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            'https://game.realmetaverse.ir/')"
          if [[ "$normal" != *"$expected"* ]]; then
            echo '::error::The unique URL is current, but the regular URL serves a cached old page. Purge the hosting/CDN HTML cache.'
            echo '❌ The standard game URL is serving an old cached HTML page.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '✅ FTPS remote file and both public HTTPS URLs serve the new NexaFly version.' >> "$GITHUB_STEP_SUMMARY"
